<style>
:root{
  --bg:#05040d; --ink:#e8ecff; --muted:#9aa3d6; --moon:#bfe8ff; --arcane:#a07dff; --gold:#ffd27a; --curse:#ff4064;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#05040d; --ink:#e8ecff; } }
:root[data-theme="dark"]{ --bg:#05040d; --ink:#e8ecff; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; background:var(--bg); overflow:hidden; overscroll-behavior:none; touch-action:none; -webkit-text-size-adjust:100%; text-size-adjust:100%; }

*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden; overscroll-behavior:none; touch-action:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;

#wrap{ position:relative; width:100%; height:100%; display:flex; justify-content:center; overflow:hidden;
  background:radial-gradient(ellipse at 50% 30%,#141033 0%,var(--bg) 70%); }

button{ font:inherit; color:inherit; border:0; background:none; padding:0; cursor:pointer; touch-action:manipulation; }
#snd{ position:absolute; top:10px; right:10px; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;

#snd:focus-visible,.btn:focus-visible,.card:focus-visible{ outline:2px solid var(--moon); outline-offset:3px; }

.ov{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  padding:24px 22px; opacity:0; visibility:hidden; transition:opacity .4s ease, visibility .4s; touch-action:none; z-index:5; }

/* ---- title ---- */

.emblem .ring{ position:absolute; inset:0; border-radius:50%; border:1px solid rgba(170,200,255,.45); }
.emblem .r1{ border-style:dashed; animation:spin 28s linear infinite; }
.emblem .r2{ inset:14px; border-color:rgba(160,125,255,.55); box-shadow:0 0 24px rgba(120,160,255,.35) inset; }
.emblem .moon{ position:absolute; left:34px; top:30px; width:60px; height:60px; border-radius:50%;

.emblem .blade{ position:absolute; left:62px; top:6px; width:4px; height:116px; border-radius:2px;
  background:linear-gradient(#fff,#8fd6ff 60%,rgba(120,120,255,0)); box-shadow:0 0 12px rgba(140,220,255,.9); transform:rotate(28deg); }

  background:linear-gradient(135deg,rgba(44,36,104,.95),rgba(14,12,38,.96)); border:1px solid rgba(150,170,255,.38);

/* ---- end screens ---- */
#over{ background:radial-gradient(ellipse at 50% 40%,rgba(90,10,40,.35),rgba(3,1,8,.9) 72%); }
#clear{ background:radial-gradient(ellipse at 50% 38%,rgba(255,210,122,.16),rgba(20,14,50,.55) 45%,rgba(3,2,12,.88) 78%); }
.big{ font-family:Cinzel,"Times New Roman",serif; font-weight:900; font-size:clamp(38px,11vw,54px); letter-spacing:.08em; line-height:1.1; }

.sub{ font-size:14px; color:#c9cff2; margin:10px 0 18px; line-height:1.8; }
.stats{ display:grid; grid-template-columns:auto auto; gap:6px 22px; padding:14px 22px; border-radius:14px; background:rgba(10,8,28,.72);

.stats dt{ color:#9aa5d8; } .stats dd{ margin:0; color:#fff; font-family:Cinzel,serif; font-weight:700; text-align:right; }

.ov .show-late{ opacity:0; animation:late .6s .5s forwards; }

#rotate{ background:#05040d; z-index:9; }
#rotate .big{ font-size:28px; color:#dfe8ff; }
@media (prefers-reduced-motion: reduce){ .emblem .r1,.btn{ animation:none; } }

<script>
(() => {
'use strict';

/* =========================================================
   Utilities
   ========================================================= */
const TAU = Math.PI * 2, PI = Math.PI;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const hyp = Math.hypot;
const angTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > PI) d -= TAU; else if (d < -PI) d += TAU; return d; };
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const rgba = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
const mix = (a, b, t) => [Math.round(lerp(a[0], b[0], t)), Math.round(lerp(a[1], b[1], t)), Math.round(lerp(a[2], b[2], t))];
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function fmtTime(s) { s = Math.floor(s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }

const C = {
  cyan: [120, 220, 255], ice: [196, 236, 255], white: [242, 247, 255], violet: [165, 125, 255], purple: [120, 80, 220],
  magenta: [255, 95, 210], red: [255, 64, 100], gold: [255, 210, 122], crimson: [255, 52, 84], teal: [110, 255, 214], pink: [255, 150, 205]
};
const FONT_EN = '"Cinzel","Times New Roman",serif';
const FONT_JP = '"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif';

/* =========================================================
   DOM / Canvas / Layout
   ========================================================= */
const $ = id => document.getElementById(id);
const wrap = $('wrap'), stage = $('stage'), cvs = $('game'), ctx = cvs.getContext('2d');
const bgC = document.createElement('canvas'), bgX = bgC.getContext('2d');
let bgDirty = true;
let DPR = 1, CW = 360, CH = 640, SCALE = 1, VW = 460, VH = 820, AW = 430, AH = 620, AX = 15, AY = 88;
const LW = 460, HUD_TOP = 90, HUD_BOT = 104;
let PILLARS = [];
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
let maxDPR = 2; // lowered automatically on slow devices

// glow sprite cache (cheap additive light instead of shadowBlur)
const glowCache = new Map();
function glowSprite(c) {
  const q = [c[0] & 0xF8, c[1] & 0xF8, c[2] & 0xF8];
  const k = q[0] * 65536 + q[1] * 256 + q[2];
  let s = glowCache.get(k);
  if (s) return s;
  s = document.createElement('canvas'); s.width = s.height = 64;
  const g = s.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, rgba(q, 1)); gr.addColorStop(0.22, rgba(q, 0.55)); gr.addColorStop(0.55, rgba(q, 0.15)); gr.addColorStop(1, rgba(q, 0));
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  glowCache.set(k, s);
  return s;
}
function glow(x, y, r, c, a) {
  if (a <= 0.003 || r <= 0.5) return;
  const pa = ctx.globalAlpha;
  ctx.globalAlpha = pa * Math.min(1, a);
  const pc = ctx.globalCompositeOperation;
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(glowSprite(c), x - r, y - r, r * 2, r * 2);
  ctx.globalCompositeOperation = pc;
  ctx.globalAlpha = pa;
}
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.01, r), 0, TAU); }

function resize() {
  const W = wrap.clientWidth || window.innerWidth, H = wrap.clientHeight || window.innerHeight;
  let gw = W;
  if (gw > H * 0.68) gw = Math.round(H * 0.6);
  stage.style.width = gw + 'px';
  stage.style.height = H + 'px';
  CW = gw; CH = H;
  DPR = Math.min(window.devicePixelRatio || 1, maxDPR);
  cvs.width = Math.max(1, Math.round(CW * DPR)); cvs.height = Math.max(1, Math.round(CH * DPR));
  cvs.style.width = CW + 'px'; cvs.style.height = CH + 'px';
  SCALE = CW / LW;
  if (CH / SCALE < 760) SCALE = CH / 760;
  VW = CW / SCALE; VH = CH / SCALE;
  AW = Math.min(430, VW - 30);
  AH = clamp(VH - HUD_TOP - HUD_BOT, 560, 980);
  AX = (VW - AW) / 2;
  AY = HUD_TOP + Math.max(0, (VH - HUD_TOP - HUD_BOT - AH) / 2);
  layoutPillars();
  clampEntities();
  bgDirty = true;
  checkOrientation();
}
function layoutPillars() {
  PILLARS = [];
  const pts = [[0, 0], [AW, 0], [0, AH], [AW, AH], [AW / 2 - 92, -2], [AW / 2 + 92, -2], [0, AH * 0.36], [AW, AH * 0.36], [0, AH * 0.7], [AW, AH * 0.7]];
  for (const p of pts) PILLARS.push({ x: p[0], y: p[1] });
}
function clampEntities() {
  if (P.r) { P.x = clamp(P.x, P.r, AW - P.r); P.y = clamp(P.y, P.r, AH - P.r); }
  if (G.enemies) for (const e of G.enemies) clampE(e);
  if (G.boss) { G.boss.x = clamp(G.boss.x, G.boss.r, AW - G.boss.r); G.boss.y = clamp(G.boss.y, G.boss.r, AH - G.boss.r); }
  if (G.portal) G.portal.x = AW / 2;
  if (G.motes) for (const m of G.motes) { m.x = clamp(m.x, 0, AW); m.y = clamp(m.y, 0, AH); }
}
function clampE(e) { e.x = clamp(e.x, e.r, AW - e.r); e.y = clamp(e.y, e.r, AH - e.r); }
function checkOrientation() {
  const land = isTouch && window.innerWidth > window.innerHeight * 1.05 && window.innerHeight < 600;
  $('rotate').classList.toggle('show', land);
  if (land && G.state === 'play') pauseGame();
}

/* =========================================================
   Data
   ========================================================= */
const AREAS = {
  1: { name: '月影の前庭', acc: [120, 215, 255], floor: ['#1b2650', '#0b1030'], void: '#0b1233' },
  2: { name: '嘆きの回廊', acc: [135, 150, 255], floor: ['#1f1e55', '#0d0c2d'], void: '#0e0c30' },
  3: { name: '星喰いの聖堂', acc: [175, 130, 255], floor: ['#281c55', '#110a2c'], void: '#130a2e' },
  4: { name: '虚月の玉座', acc: [225, 120, 255], floor: ['#2d1745', '#12071f'], void: '#170822' }
};
const WAVES = {

  ctx.beginPath(); ctx.arc(P.x, P.y, 26, -PI / 2, -PI / 2 + TAU * (ok ? p : Math.min(p, 0.999))); ctx.stroke();
  if (ok) glow(P.x, P.y, 30 + 24 * p, col, 0.3 + 0.3 * p);
  if (P.chargeReady) {
    const pulse = 1 + 0.1 * Math.sin(G.t * 18);
    ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = rgba(C.cyan, 0.6); ctx.lineWidth = 2; circle(P.x, P.y, 34 * pulse); ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (P.chargeReady) { ctx.font = '700 13px ' + FONT_EN; ctx.fillStyle = '#fff'; ctx.fillText('RELEASE!', P.x, P.y - 42); }
  else if (!ok && p >= 1) { ctx.font = '700 13px ' + FONT_JP; ctx.fillStyle = 'rgba(190,200,230,0.9)'; ctx.fillText('魔力不足', P.x, P.y - 40); }
  ctx.restore();
}

/* =========================================================
   Rendering: HUD / screen
   ========================================================= */
function drawHUD() {
  if (G.state === 'title') return;
  const pad = 14;
  // HP
  const hw = Math.min(176, VW * 0.4), hx = pad + 24, hy = 18, hh = 13;
  ctx.save();
  glow(pad + 9, hy + hh / 2, 16, C.red, 0.5);
  ctx.fillStyle = '#ff5d8f';
  ctx.beginPath(); ctx.moveTo(pad + 9, hy - 2); ctx.lineTo(pad + 16, hy + hh / 2); ctx.lineTo(pad + 9, hy + hh + 2); ctx.lineTo(pad + 2, hy + hh / 2); ctx.closePath(); ctx.fill();
  rr(ctx, hx - 2, hy - 2, hw + 4, hh + 4, 8); ctx.fillStyle = 'rgba(8,6,22,0.82)'; ctx.fill(); ctx.strokeStyle = 'rgba(200,210,255,0.22)'; ctx.lineWidth = 1; ctx.stroke();
  const r1 = Math.max(0, P.hpLag / P.maxHp), r2 = Math.max(0, P.hp / P.maxHp);
  if (r1 > 0) { rr(ctx, hx, hy, hw * r1, hh, 6); ctx.fillStyle = 'rgba(255,240,245,0.55)'; ctx.fill(); }
  if (r2 > 0) {
    rr(ctx, hx, hy, Math.max(hh, hw * r2), hh, 6);
    const g = ctx.createLinearGradient(hx, 0, hx + hw, 0); g.addColorStop(0, '#ff3d6e'); g.addColorStop(1, '#ff8fb1');
    ctx.fillStyle = g; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(hx + 4, hy + 2, Math.max(0, hw * r2 - 8), 3);
    if (r2 < 0.3 && P.alive) { ctx.globalAlpha = 0.4 + 0.4 * Math.sin(G.t * 8); rr(ctx, hx, hy, Math.max(hh, hw * r2), hh, 6); ctx.fillStyle = '#fff'; ctx.fill(); ctx.globalAlpha = 1; }
  }
  ctx.font = '700 13px ' + FONT_EN; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = 'rgba(225,232,255,0.85)';
  ctx.fillText(Math.ceil(P.hp) + ' / ' + P.maxHp, hx, hy + hh + 6);
  // Area label
  const rx = VW - pad - 44 / SCALE;
  ctx.textAlign = 'right';
  ctx.font = '700 17px ' + FONT_EN; ctx.fillStyle = '#fff';
  ctx.fillText(G.area < 4 ? 'AREA ' + G.area : 'FINAL', rx, hy - 3);
  ctx.font = '600 13px ' + FONT_JP; ctx.fillStyle = rgba(AREAS[G.area].acc, 0.95);
  ctx.fillText(AREAS[G.area].name, rx, hy + 18);
  if (G.area < 4 && G.waves.length) {
    for (let i = 0; i < G.waves.length; i++) {
      const done = i < G.waveIdx || (i === G.waveIdx && (G.areaPhase === 'clear' || G.areaPhase === 'portal' || G.areaPhase === 'between'));
      const cur = i === G.waveIdx && !done;
      const px = rx - (G.waves.length - 1 - i) * 13 - 4, py = hy + 42;
      ctx.fillStyle = done ? rgba(C.gold, 0.95) : cur ? '#fff' : 'rgba(255,255,255,0.25)';
      ctx.beginPath(); ctx.moveTo(px, py - 4); ctx.lineTo(px + 4, py); ctx.lineTo(px, py + 4); ctx.lineTo(px - 4, py); ctx.closePath(); ctx.fill();
    }
  }
  // Boss bar
  const B = G.boss;
  if (B && !B.dead && (B.state !== 'intro' || B.t > 1.5)) {
    const bw = VW - pad * 2 - 8, bx = (VW - bw) / 2, by = 64, bh = 10;
    const bl = B.blend, col1 = mix([160, 120, 255], [255, 50, 90], bl), col2 = mix([120, 220, 255], [255, 140, 90], bl);
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.font = '700 13px ' + FONT_EN; ctx.fillStyle = '#fff';
    ctx.fillText('NEPHELION', VW / 2, by - 3);
    ctx.font = '600 11px ' + FONT_JP; ctx.fillStyle = rgba(col1, 1); ctx.textAlign = 'left';
    ctx.fillText(B.phase === 2 ? '第二形態' : '虚月の守護者', bx, by - 3);
    rr(ctx, bx - 2, by - 2, bw + 4, bh + 4, 3); ctx.fillStyle = 'rgba(8,4,18,0.85)'; ctx.fill(); ctx.strokeStyle = rgba(col1, 0.5); ctx.lineWidth = 1; ctx.stroke();
    const lr = clamp(B.lagHp / B.maxHp, 0, 1), dr = clamp(B.dispHp / B.maxHp, 0, 1);
    ctx.fillStyle = 'rgba(255,240,250,0.5)'; ctx.fillRect(bx, by, bw * Math.min(lr, B.state === 'intro' ? dr : 1), bh);
    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0); g.addColorStop(0, rgba(col1, 1)); g.addColorStop(1, rgba(col2, 1));
    ctx.fillStyle = g; ctx.fillRect(bx, by, bw * dr, bh);
    ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(bx, by + 1, bw * dr, 2);
    ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillRect(bx + bw * 0.5 - 1, by - 3, 2, bh + 6);
    if (B.flash > 0) glow(bx + bw * dr, by + bh / 2, 18, col2, 0.8);
  }
  // Special gauge
  const gw = Math.min(230, VW * 0.56), gx = (VW - gw) / 2, gcy = AY + AH + (VH - AY - AH) * 0.52, gh = 10;
  const full = P.mana >= 100, mr = P.mana / 100;
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.font = '700 12px ' + FONT_JP; ctx.fillStyle = full ? '#fff' : 'rgba(190,205,255,0.75)';
  ctx.fillText(full ? '長押し → 離して 必殺技' : '必殺ゲージ', VW / 2, gcy - 9);
  rr(ctx, gx - 2, gcy - 2, gw + 4, gh + 4, 7); ctx.fillStyle = 'rgba(8,6,22,0.85)'; ctx.fill();
  ctx.strokeStyle = full ? rgba(C.cyan, 0.8) : 'rgba(180,200,255,0.25)'; ctx.lineWidth = 1; ctx.stroke();
  if (mr > 0) {
    rr(ctx, gx, gcy, Math.max(gh, gw * mr), gh, 5);
    const g = ctx.createLinearGradient(gx, 0, gx + gw, 0); g.addColorStop(0, '#6a7cff'); g.addColorStop(1, full ? '#dff6ff' : '#78dcff');
    ctx.fillStyle = g; ctx.fill();
  }
  ctx.fillStyle = 'rgba(8,6,22,0.9)';
  for (let i = 1; i < 5; i++) ctx.fillRect(gx + gw * i / 5 - 0.75, gcy, 1.5, gh);
  for (const s of [-1, 1]) {
    const dx = VW / 2 + s * (gw / 2 + 12);
    ctx.fillStyle = full ? '#dff6ff' : 'rgba(150,170,255,0.6)';
    ctx.beginPath(); ctx.moveTo(dx, gcy + gh / 2 - 6); ctx.lineTo(dx + 5, gcy + gh / 2); ctx.lineTo(dx, gcy + gh / 2 + 6); ctx.lineTo(dx - 5, gcy + gh / 2); ctx.closePath(); ctx.fill();
  }
  if (full) glow(VW / 2, gcy + gh / 2, gw * 0.55, C.cyan, 0.22 + 0.12 * Math.sin(G.t * 6));
  ctx.restore();
}
function drawBanner() {
  const B = G.banner; if (!B) return;
  const t = B.t, d = B.dur;
  const inP = clamp(t / 0.35, 0, 1), outP = clamp((d - t) / 0.35, 0, 1), a = Math.min(inP, outP);
  const cy = VH * 0.38;
  ctx.save();
  const bh = 92 * (0.6 + 0.4 * easeOut(inP));
  const g = ctx.createLinearGradient(0, 0, VW, 0);
  g.addColorStop(0, 'rgba(5,4,16,0)'); g.addColorStop(0.5, 'rgba(5,4,16,0.66)'); g.addColorStop(1, 'rgba(5,4,16,0)');
  ctx.globalAlpha = a; ctx.fillStyle = g; ctx.fillRect(0, cy - bh / 2, VW, bh);
  ctx.globalCompositeOperation = 'lighter';
  if (B.kind !== 'area') {
    ctx.save(); ctx.translate(VW / 2, cy); ctx.rotate(G.t * 0.25);
    ctx.fillStyle = rgba(B.col, 0.07);
    for (let i = 0; i < 12; i++) {
      ctx.rotate(TAU / 12);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(300, -16); ctx.lineTo(300, 16); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  const lw = VW * 0.82 * easeOut(inP);
  ctx.fillStyle = rgba(B.col, 0.85);
  ctx.fillRect(VW / 2 - lw / 2, cy - bh / 2, lw, 1.5); ctx.fillRect(VW / 2 - lw / 2, cy + bh / 2 - 1.5, lw, 1.5);
  glow(VW / 2, cy, 170, B.col, 0.3 * a);
  ctx.globalCompositeOperation = 'source-over';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 42px ' + FONT_EN;
  const tw = ctx.measureText(B.big).width;
  const sc = lerp(1.4, 1, easeOut(inP)) * Math.min(1, (VW * 0.88) / Math.max(1, tw));
  ctx.save(); ctx.translate(VW / 2, cy - 8); ctx.scale(sc, sc);
  ctx.shadowColor = rgba(B.col, 0.95); ctx.shadowBlur = 18;
  ctx.fillStyle = '#fff'; ctx.fillText(B.big, 0, 0);
  ctx.shadowBlur = 0;
  ctx.restore();
  if (B.sub) { ctx.font = '600 16px ' + FONT_JP; ctx.fillStyle = rgba(mix(B.col, C.white, 0.5), 1); ctx.fillText(B.sub, VW / 2, cy + 28); }
  ctx.restore();
}
function drawToasts() {
  let y = AY + AH - 30;
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = G.toasts.length - 1; i >= 0; i--) {
    const T = G.toasts[i];
    const a = Math.min(1, T.t / 0.25, (T.dur - T.t) / 0.4);
    if (a <= 0) continue;
    ctx.globalAlpha = a;
    ctx.font = '700 15px ' + FONT_JP;
    const w = ctx.measureText(T.text).width + 30;
    rr(ctx, VW / 2 - w / 2, y - 15, w, 30, 15);
    ctx.fillStyle = 'rgba(8,6,22,0.78)'; ctx.fill();
    ctx.strokeStyle = rgba(T.col, 0.55); ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = rgba(T.col, 1); ctx.fillText(T.text, VW / 2, y + 1);
    y -= 38;
  }
  ctx.restore();
}
function drawJoy() {
  if (!(IN.mode === M_DRAG || (IN.mode === M_CHARGE && IN.cmoved)) || G.state !== 'play') return;
  const r = cvs.getBoundingClientRect();
  const ax = (IN.ax - r.left) / SCALE, ay = (IN.ay - r.top) / SCALE, x = (IN.x - r.left) / SCALE, y = (IN.y - r.top) / SCALE;
  const R = JOY_MAX / SCALE;
  ctx.save();
  ctx.fillStyle = 'rgba(120,160,255,0.06)'; circle(ax, ay, R); ctx.fill();
  ctx.strokeStyle = 'rgba(180,210,255,0.22)'; ctx.lineWidth = 1.5; circle(ax, ay, R); ctx.stroke();
  let dx = x - ax, dy = y - ay; const l = hyp(dx, dy);
  if (l > R) { dx = dx / l * R; dy = dy / l * R; }
  ctx.fillStyle = 'rgba(210,235,255,0.28)'; circle(ax + dx, ay + dy, 17); ctx.fill();
  glow(ax + dx, ay + dy, 22, C.cyan, 0.3);
  ctx.restore();
}
function drawScreenFx() {
  const vg = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.35, VW / 2, VH / 2, Math.max(VW, VH) * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,8,0.5)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
  let red = G.hurtFx * 0.55;
  if (G.state === 'play' && P.alive && P.hp / P.maxHp < 0.3) red = Math.max(red, 0.22 + 0.14 * Math.sin(G.t * 6));
  if (red > 0.01) {
    const rg = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.3, VW / 2, VH / 2, Math.max(VW, VH) * 0.7);
    rg.addColorStop(0, 'rgba(255,0,40,0)'); rg.addColorStop(1, 'rgba(255,20,60,' + Math.min(0.8, red) + ')');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, VW, VH);
  }
  if (G.flash > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = rgba(G.flashCol, Math.min(0.75, G.flash * 0.6)); ctx.fillRect(0, 0, VW, VH);
    ctx.restore();
  }
  if (G.slowT > 0 && G.slowScale < 0.5) {
    ctx.save(); ctx.globalAlpha = Math.min(1, G.slowT * 3) * 0.35;
    ctx.fillStyle = 'rgba(40,20,90,1)'; ctx.fillRect(0, 0, VW, 6); ctx.fillRect(0, VH - 6, VW, 6);
    ctx.restore();
  }
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (bgDirty) buildBg();
  const sx = G.shake > 0 ? rand(-1, 1) * G.shake : 0, sy = G.shake > 0 ? rand(-1, 1) * G.shake : 0;
  const k = DPR * SCALE;
  ctx.fillStyle = '#030208'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  ctx.drawImage(bgC, sx * k, sy * k);
  ctx.setTransform(k, 0, 0, k, (AX + sx) * k, (AY + sy) * k);
  drawFloorFx();
  if (G.dark > 0) { ctx.fillStyle = 'rgba(2,1,10,' + G.dark + ')'; ctx.fillRect(-AX - 30, -AY - 30, VW + 60, VH + 60); }
  drawFlames();
  drawZones();
  drawGround();
  drawPortal();
  drawPickups();
  drawAfters();
  const list = [];
  for (const e of G.enemies) list.push(e);
  if (P.alive && G.state !== 'title') list.push(P);
  if (G.boss && !G.boss.dead) list.push(G.boss);
  list.sort((a, b) => a.y - b.y);
  for (const o of list) { if (o === P) drawPlayer(); else if (o.isBoss) drawBoss(o); else drawEnemy(o); }
  drawBossOver(G.boss);
  drawSwing();
  drawBullets();
  drawChargeUI();
  drawParticles();
  drawMotes();
  drawNums();
  ctx.setTransform(k, 0, 0, k, 0, 0);
  drawScreenFx();
  drawJoy();
  drawHUD();
  drawToasts();
  drawBanner();
  if (G.fade > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = 'rgba(2,1,8,' + Math.min(1, G.fade) + ')'; ctx.fillRect(0, 0, cvs.width, cvs.height); }
}

/* =========================================================
   Main loop
   ========================================================= */
let last = 0, perfAcc = 0, perfN = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  let rdt = last ? (ts - last) / 1000 : 0.016;
  last = ts;
  if (!(rdt > 0)) rdt = 0; if (rdt > 0.05) rdt = 0.05;
  if (G.state === 'play' && rdt > 0) {
    perfAcc += rdt; perfN++;
    if (perfN >= 150) {
      const avg = perfAcc / perfN; perfAcc = 0; perfN = 0;
      if (avg > 0.024 && maxDPR > 1.25 && (window.devicePixelRatio || 1) > 1.25) { maxDPR = Math.max(1.25, maxDPR - 0.5); resize(); }
    }
  }
  let gdt;
  if (G.state === 'paused') gdt = 0;
  else if (G.hitstop > 0) { G.hitstop -= rdt; gdt = 0; }
  else gdt = rdt * (G.slowT > 0 ? G.slowScale : 1);
  try { update(gdt, rdt); } catch (err) { console.error(err); }
  try { render(); } catch (err) { console.error(err); }
}

resetGame();
resize();
initMotes();
G.state = 'title';
if (document.fonts && document.fonts.load) { document.fonts.load('700 20px Cinzel').then(() => { bgDirty = true; }).catch(() => { }); }
requestAnimationFrame(frame);
/*__EXPOSE__*/
})();
</script>
